<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Detail</title>
    <link rel="stylesheet" href="./src/output.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="flex h-screen flex-col lg:flex-row">
        <!-- Mobile Menu Toggle -->
        <button id="menu-toggle" class="fixed top-4 left-4 z-50 lg:hidden bg-blue-700 text-white p-2 rounded-lg">
            <span id="menu-icon">☰</span>
        </button>

        <!-- Sidebar - Hidden on Mobile -->
        <aside id="sidebar" class="fixed inset-0 lg:relative lg:inset-auto w-64 bg-white border-r border-gray-200 p-4 lg:p-6 flex flex-col z-40 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out max-h-screen overflow-y-auto">
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full border-2 border-gray-400 flex items-center justify-center">
                        <span class="text-sm font-bold">⊙</span>
                    </div>
                    <h1 class="text-xl font-bold">Dashboard</h1>
                </div>
                <button id="close-menu" class="lg:hidden text-gray-500 text-xl">✕</button>
            </div>

            <nav class="space-y-4 flex-1">
                <div class="flex items-center gap-3 text-gray-700 hover:text-blue-600 cursor-pointer transition">
                    <span class="text-xl">📊</span>
                    <span class="hidden sm:inline">Overview</span>
                </div>
                <div class="flex items-center gap-3 text-gray-700 hover:text-blue-600 cursor-pointer transition">
                    <span class="text-xl">👥</span>
                    <span class="hidden sm:inline">Users Management</span>
                </div>
                <div class="flex items-center gap-3 text-gray-700 hover:text-blue-600 cursor-pointer transition">
                    <span class="text-xl">🎥</span>
                    <span class="hidden sm:inline">Videos Management</span>
                </div>
                <div class="flex items-center gap-3 text-gray-700 hover:text-blue-600 cursor-pointer transition">
                    <span class="text-xl">📁</span>
                    <span class="hidden sm:inline">Playlist Management</span>
                </div>
                <div class="flex items-center gap-3 text-blue-600 font-semibold cursor-pointer transition">
                    <span class="text-xl">⬆️</span>
                    <span class="hidden sm:inline">Upload Video</span>
                </div>
            </nav>

            <div class="space-y-4 border-t border-gray-200 pt-4">
                <div class="flex items-center gap-3 text-gray-700 hover:text-blue-600 cursor-pointer transition">
                    <span class="text-xl">🎨</span>
                    <span class="hidden sm:inline">Themes</span>
                </div>
                <div class="flex items-center gap-3 text-red-600 cursor-pointer transition">
                    <span class="text-xl">🚪</span>
                    <span class="hidden sm:inline">Log Out</span>
                </div>
            </div>
        </aside>

        <!-- Overlay for Mobile -->
        <div id="overlay" class="fixed inset-0 bg-black bg-opacity-50 z-30 hidden lg:hidden"></div>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col w-full pt-16 lg:pt-0">
            <!-- Top Header -->
            <header class="bg-white border-b border-gray-200 p-4 lg:p-6 flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4">
                <div class="flex-1 w-full max-w-md">
                    <div class="relative">
                        <input type="text" placeholder="Search" class="w-full px-4 py-2 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        <button class="absolute right-3 top-2.5 text-gray-400">🔍</button>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white text-sm font-bold flex-shrink-0">
                        <img src="../img/logo.png" alt="logo" class="w-10 h-10 rounded-full">
                    </div>
                    <div class="hidden sm:block">
                        <p class="font-semibold text-sm">VSTAD</p>
                        <p class="text-xs text-gray-500">VSTAD168</p>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <main class="flex-1 p-4 lg:p-6 overflow-y-auto">
                <!-- Back and Delete Buttons -->
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 mb-6">
                    <button class="flex items-center gap-2 bg-blue-700 text-white px-3 lg:px-4 py-2 rounded-lg hover:bg-blue-800 transition text-sm">
                        ← Back
                    </button>
                    <button class="flex items-center gap-2 bg-red-600 text-white px-3 lg:px-4 py-2 rounded-lg hover:bg-red-700 transition text-sm">
                        🗑️ Delete
                    </button>
                </div>

                <!-- User Profile Card -->
                <div class="bg-white border border-gray-300 rounded-lg p-4 lg:p-6 mb-6">
                    <div class="flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4">
                        <div class="flex items-center gap-4 w-full">
                            <div class="relative flex-shrink-0">
                                <img src="../img/image.png" alt="Avatar" class="w-16 h-16 rounded-full object-cover">
                            </div>
                            <div class="flex-1 min-w-0">
                                <h2 class="text-xl lg:text-2xl font-bold truncate">Lina</h2>
                                <div class="flex gap-2 mt-2 flex-wrap">
                                    <span class="px-3 py-1 bg-blue-100 text-blue-700 text-xs font-semibold rounded-full whitespace-nowrap">Active</span>
                                    <span class="px-3 py-1 bg-blue-700 text-white text-xs font-semibold rounded-full whitespace-nowrap">User</span>
                                </div>
                            </div>
                        </div>
                        <button class="flex items-center gap-2 bg-blue-700 text-white px-3 lg:px-4 py-2 rounded-lg hover:bg-blue-800 transition text-sm whitespace-nowrap">
                            ✏️ Edit role
                        </button>
                    </div>
                </div>

                <!-- Information Card -->
                <div class="bg-white border border-gray-300 rounded-lg p-4 lg:p-6">
                    <h3 class="text-lg font-bold mb-1">Information</h3>
                    <p class="text-gray-500 text-sm mb-6">User's information</p>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                        <div>
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-lg">✉️</span>
                                <p class="text-sm text-gray-500">Email</p>
                            </div>
                            <p class="font-semibold text-sm lg:text-base break-all">lina@gmail.com</p>
                        </div>
                        <div>
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-lg">👤</span>
                                <p class="text-sm text-gray-500">Username</p>
                            </div>
                            <p class="font-semibold text-sm lg:text-base">Lina</p>
                        </div>
                        <div>
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-lg">📅</span>
                                <p class="text-sm text-gray-500">Created</p>
                            </div>
                            <p class="font-semibold text-sm lg:text-base">22/11/2025</p>
                        </div>
                    </div>

                    <div class="mt-6 pt-6 border-t border-gray-200">
                        <p class="text-sm text-gray-500 mb-2">Bio</p>
                        <p class="text-gray-600 text-sm">text...</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const closeMenu = document.getElementById('close-menu');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleMenu() {
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
            document.body.style.overflow = sidebar.classList.contains('-translate-x-full') ? 'auto' : 'hidden';
        }

        menuToggle.addEventListener('click', toggleMenu);
        closeMenu.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        // Close menu when clicking on navigation items
        const navItems = sidebar.querySelectorAll('nav div, .border-t + div');
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                if (window.innerWidth < 1024) {
                    toggleMenu();
                }
            });
        });
    </script>
</body>
</html>
