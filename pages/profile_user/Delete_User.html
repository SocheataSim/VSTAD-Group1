<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete User </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'modal-blue': '#3B82F6',
                        'modal-red': '#EF4444',
                        'modal-bg': '#F8FAFC'
                    },
                    borderRadius: {
                        'modal': '16px'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <!-- Delete User Modal -->
    <div class="w-full max-w-sm">
        <!-- Modal Title (delete-user) - Outside the main container -->
        <div class="text-center mb-4">
            <span class="text-xs text-gray-500 font-medium tracking-wide">delete-user</span>
        </div>

        <!-- Main Modal Container -->
        <div class="bg-white rounded-2xl border border-gray-200/50 shadow-sm p-6">
            <!-- Modal Header -->
            <div class="text-center mb-6">
                <h2 class="text-xl font-semibold text-gray-900">Delete User</h2>
            </div>

            <!-- Modal Body -->
            <div class="mb-8">
                <p class="text-sm leading-6 text-gray-700 text-center">
                    Are you sure you want to delete this user?
                </p>
            </div>

            <!-- Modal Footer - Buttons -->
            <div class="flex items-center justify-center space-x-4">
                <!-- Cancel Button -->
                <button
                    type="button"
                    class="flex-1 max-w-[112px] h-11 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:ring-offset-2 transition-all duration-200 flex items-center justify-center"
                    onclick="closeModal()"
                >
                    Cancel
                </button>

                <!-- Delete Button -->
                <button
                    type="button"
                    class="flex-1 max-w-[112px] h-11 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-red-500 hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500/20 focus:ring-offset-2 transition-all duration-200 flex items-center justify-center"
                    onclick="confirmDelete()"
                >
                    Delete
                </button>
            </div>
        </div>
    </div>

    <script>
        // Modal functionality
        function closeModal() {
            // In a real app, this would close the modal
            alert('Modal would close here');
            console.log('Cancel clicked');
        }

        function confirmDelete() {
            // Show loading state
            const deleteBtn = event.target;
            const originalText = deleteBtn.innerHTML;
            
            deleteBtn.innerHTML = '<span class="flex items-center">Deleting...</span>';
            deleteBtn.disabled = true;
            deleteBtn.classList.add('opacity-75', 'cursor-not-allowed');
            
            // Simulate API call with 1.6s delay (as shown in your screenshot)
            setTimeout(() => {
                alert('User deleted successfully!');
                console.log('User deleted');
            }, 1600);
        }

        // Add hover effects
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-1px)';
            });
            
            button.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0)';
            });
        });
    </script>

    <style>
        /* Perfect border radius matching the screenshot */
        .rounded-2xl {
            border-radius: 16px;
        }
        
        /* Ensure perfect button sizing */
        button {
            min-height: 44px;
        }
        
        /* Subtle shadow matching the design */
        .shadow-sm {
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        }
        
        /* Perfect spacing */
        .p-6 {
            padding: 1.5rem;
        }
        
        .mb-6 {
            margin-bottom: 1.5rem;
        }
        
        .mb-8 {
            margin-bottom: 2rem;
        }
        
        .space-x-4 > * + * {
            margin-left: 1rem;
        }
    </style>
</body>
</html>
